# Русификатор сборки AMDH-Mine: только языковые файлы, без кода.
modLoader = "lowcodefml"
loaderVersion = "[4,)"
license = "Переводы: CC0. Исходные строки модов принадлежат их авторам."

[[mods]]
modId = "amdh_rus"
version = "1.0.3"
displayName = "AMDH-Mine: русификатор"
authors = "Lukider228"
description = '''
Дописывает недостающий русский перевод модов сборки AMDH-Mine.
'''

# Грузиться после переводимых модов: из одинаковых ключей побеждает тот
# пакет ресурсов, что загружен позже. Без этого английские строки внутри
# их собственных ru_ru.json перекрывали бы перевод.

[[dependencies.amdh_rus]]
